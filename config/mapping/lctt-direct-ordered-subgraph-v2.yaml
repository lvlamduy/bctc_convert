  minimum_independent_semantic_streams_for_automatic_selection: 2
  currently_available_independent_semantic_streams: 1
  minimum_monotone_candidate_label_score: 0.45
  minimum_composite_anchor_runner_up_margin: 0.10
  not_observed_report_norm_ids:
    - 4143
    - 4151
    - 4152
    - 4117
  composite_source_rows:
