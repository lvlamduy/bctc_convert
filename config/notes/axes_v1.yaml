# Dimension axes for notes (thuyết minh). An axis is a closed list of members
# shared by every concept that is broken down along it, so "Nhóm 2" of loans,
# of debt securities and of purchased debt are the same member. Aliases are
# matched on PRIMARY_LABEL_KEY_V1 keys (accents folded, enumerators/bullets
# removed); a row matches a member only when exactly one member accepts it.
# Adding a member never changes other members or other axes.
format_version: NOTES_AXES_V1

axes:
  CREDIT_QUALITY_GROUP:
    description: Phân loại nợ theo 5 nhóm (TT11/2021, TT31/2024)
    members:
      G1:
        name: Nhóm 1 - Nợ đủ tiêu chuẩn
        aliases: [nhom 1, no du tieu chuan, nhom 1 no du tieu chuan, du tieu chuan]
      G2:
        name: Nhóm 2 - Nợ cần chú ý
        aliases: [nhom 2, no can chu y, nhom 2 no can chu y, can chu y]
      G3:
        name: Nhóm 3 - Nợ dưới tiêu chuẩn
        aliases: [nhom 3, no duoi tieu chuan, nhom 3 no duoi tieu chuan, duoi tieu chuan]
      G4:
        name: Nhóm 4 - Nợ nghi ngờ
        aliases: [nhom 4, no nghi ngo, nhom 4 no nghi ngo, nghi ngo]
      G5:
        name: Nhóm 5 - Nợ có khả năng mất vốn
        aliases: [nhom 5, no co kha nang mat von, nhom 5 no co kha nang mat von, co kha nang mat von]
    # Printed alongside the five groups by some banks; outside the 5-group sum.
    outside_members:
      PENDING_WITH_FORECLOSED_COLLATERAL:
        name: Nợ chờ xử lý đã có tài sản gán, xiết nợ
        contains_all: [[cho xu ly, gan], [cho xu ly, xiet]]
      MARGIN_AND_SECURITIES_ADVANCE:
        name: Cho vay giao dịch ký quỹ và ứng trước tiền bán chứng khoán
        contains_all: [[ky quy], [ung truoc tien ban chung khoan]]

  DEPOSIT_TYPE:
    description: Loại tiền gửi (không kỳ hạn, có kỳ hạn, tiết kiệm, ký quỹ, vốn chuyên dùng, đảm bảo thanh toán khác)
    members:
      DEMAND: {name: Tiền gửi không kỳ hạn, aliases: [khong ky han, tien gui thanh toan]}
      TERM: {name: Tiền gửi có kỳ hạn, aliases: [co ky han]}
      SAVINGS: {name: Tiền gửi tiết kiệm, aliases: [tiet kiem], dominates: [DEMAND, TERM]}
      SAVINGS_DEMAND: {name: Tiền gửi tiết kiệm không kỳ hạn, all_of: [[tiet kiem, khong ky han]], parent: SAVINGS,
                       dominates: [SAVINGS, DEMAND, TERM]}
      SAVINGS_TERM: {name: Tiền gửi tiết kiệm có kỳ hạn, all_of: [[tiet kiem, co ky han]], parent: SAVINGS,
                     dominates: [SAVINGS, DEMAND, TERM]}
      MARGIN: {name: Tiền ký quỹ, aliases: [ky quy]}
      SPECIAL_PURPOSE: {name: Tiền gửi vốn chuyên dùng, aliases: [von chuyen dung]}
      OTHER_PAYMENT_GUARANTEE: {name: Tiền gửi đảm bảo thanh toán khác, aliases: [dam bao thanh toan]}

  CURRENCY:
    description: Đồng tiền của số dư
    members:
      VND: {name: Bằng VND, aliases: [vnd, bang dong viet nam, bang tien dong, bang dong]}
      FOREIGN_CURRENCY: {name: Bằng ngoại tệ, aliases: [ngoai te]}
      GOLD: {name: Bằng vàng, aliases: [bang vang]}
      FOREIGN_CURRENCY_AND_GOLD: {name: Bằng ngoại tệ và vàng, aliases: [ngoai te va vang], dominates: [FOREIGN_CURRENCY]}

  CUSTOMER_ENTITY_TYPE:
    description: Loại hình khách hàng / doanh nghiệp (dùng chung cho cho vay và tiền gửi)
    members:
      ECONOMIC_ORGANIZATIONS: {name: Tổ chức kinh tế, aliases: [to chuc kinh te, tckt]}
      STATE_OWNED: {parent: ECONOMIC_ORGANIZATIONS, name: Doanh nghiệp nhà nước, aliases: [doanh nghiep nha nuoc, dnnn, cong ty nha nuoc]}
      LLC: {parent: ECONOMIC_ORGANIZATIONS, name: Công ty TNHH, aliases: [cong ty tnhh, trach nhiem huu han, tnhh]}
      LLC_STATE: {name: Công ty TNHH nhà nước (không in tỷ lệ), parent: LLC,
                  all_of: [[tnhh, nha nuoc], [trach nhiem huu han, nha nuoc]], dominates: [LLC, STATE_OWNED]}
      LLC_STATE_100: {name: Công ty TNHH MTV vốn nhà nước 100%, parent: LLC,
                      all_of: [[tnhh, 100], [trach nhiem huu han, 100]], dominates: [LLC, LLC_STATE, STATE_OWNED]}
      LLC_STATE_OVER_50: {name: Công ty TNHH vốn nhà nước trên 50%, parent: LLC,
                          all_of: [[tnhh, tren 50], [trach nhiem huu han, tren 50], [tnhh, hon 50], [trach nhiem huu han, hon 50]],
                          dominates: [LLC, LLC_STATE, STATE_OWNED]}
      LLC_OTHER: {name: Công ty TNHH khác, parent: LLC, all_of: [[tnhh, khac], [trach nhiem huu han, khac]], dominates: [LLC, OTHER]}
      # "cổ phần" and "có phần" fold to the same letters: JSC needs "công ty cổ phần".
      JSC: {parent: ECONOMIC_ORGANIZATIONS, name: Công ty cổ phần, aliases: [cong ty co phan, ctcp]}
      JSC_STATE: {name: Công ty cổ phần nhà nước (không in tỷ lệ), parent: JSC, all_of: [[cong ty co phan, nha nuoc]],
                  dominates: [JSC, STATE_OWNED]}
      JSC_STATE_OVER_50: {name: Công ty cổ phần có vốn nhà nước trên 50%, parent: JSC,
                          all_of: [[cong ty co phan, tren 50], [cong ty co phan, hon 50]], dominates: [JSC, JSC_STATE, STATE_OWNED]}
      JSC_OTHER: {name: Công ty cổ phần khác, parent: JSC, all_of: [[cong ty co phan, khac]], dominates: [JSC, OTHER]}
      PRIVATE_ENTERPRISE: {parent: ECONOMIC_ORGANIZATIONS, name: Doanh nghiệp tư nhân, aliases: [doanh nghiep tu nhan, dntn]}
      PRIVATE_AND_PARTNERSHIP: {parent: ECONOMIC_ORGANIZATIONS, name: Doanh nghiệp tư nhân và công ty hợp danh, all_of: [[tu nhan, hop danh]],
                                dominates: [PRIVATE_ENTERPRISE, PARTNERSHIP]}
      COMBINED_JSC_LLC_PRIVATE: {parent: ECONOMIC_ORGANIZATIONS, name: Công ty CP, TNHH, DN tư nhân, all_of: [[co phan, tnhh, tu nhan]],
                                 dominates: [JSC, LLC, PRIVATE_ENTERPRISE]}
      COOPERATIVE: {parent: ECONOMIC_ORGANIZATIONS, name: Hợp tác xã và liên hợp tác xã, aliases: [hop tac xa]}
      COOPERATIVE_AND_PRIVATE: {parent: ECONOMIC_ORGANIZATIONS, name: Hợp tác xã và công ty tư nhân, all_of: [[hop tac xa, tu nhan]],
                                dominates: [COOPERATIVE, PRIVATE_ENTERPRISE]}
      JOINT_VENTURE: {parent: ECONOMIC_ORGANIZATIONS, name: Công ty liên doanh, aliases: [lien doanh]}
      PARTNERSHIP: {parent: ECONOMIC_ORGANIZATIONS, name: Công ty hợp danh, aliases: [hop danh]}
      FOREIGN_INVESTED: {parent: ECONOMIC_ORGANIZATIONS, name: Doanh nghiệp có vốn nước ngoài, aliases: [von nuoc ngoai, von dau tu nuoc ngoai, fdi]}
      HOUSEHOLD_INDIVIDUAL: {name: Hộ kinh doanh, cá nhân, aliases: [ca nhan, ho kinh doanh, ho gia dinh]}
      ADMIN_ASSOCIATION: {parent: ECONOMIC_ORGANIZATIONS, name: Hành chính sự nghiệp, Đảng, đoàn thể, hiệp hội, aliases: [hanh chinh su nghiep, doan the, hiep hoi]}
      OTHER: {parent: ECONOMIC_ORGANIZATIONS, name: Khác, aliases: [doi tuong khac, khach hang khac, to chuc khac],
              exact: [khac, khac khac, tien gui khac, cho vay khac, doanh nghiep khac, cac doi tuong khac]}
