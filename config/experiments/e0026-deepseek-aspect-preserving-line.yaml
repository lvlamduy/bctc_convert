    lower_cer_than_ppocrv6: true
    no_title_exactness_regression_vs_ppocrv6: true
    zero_structural_rejections: true
    zero_empty_or_suffix_truncated_predictions: true
    maximum_raw_output_characters_at_most: 512
  downstream_gate_required: true
  downstream_metrics:
