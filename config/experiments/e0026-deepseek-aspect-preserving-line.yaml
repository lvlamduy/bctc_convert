authority:
  ppocrv6_geometry: true
  deepseek_semantic_proposal_only: true
  independent_numeric_reader_required: true
  vietocr_challenger_only: true
  automatic_model_promotion: false
  numeric_period_unit_sign_scope_mapping_truth: false
  e0022_reuse_or_retuning: false

claim_boundary: >-
  E-0026 is a second bounded configuration on the already frozen E-0024
  calibration crops. It tests aspect preservation and a fail-closed decoder
  budget only. It is not bank/period-disjoint validation, human gold, a
  production reader decision, end-to-end accuracy, or permission to use E-0022.
