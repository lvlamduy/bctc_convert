  development smoke on this calibration block. They are calibration controls,
  not untouched-holdout thresholds or an accuracy claim. No expected value,
  disagreement cell identity, human review, schema ID or historical value is
  encoded in this control.

claim_boundary: >-
  E-0031 measures independent numeric/sign/dash agreement on the already
  accepted and reconstructed MBB CDKT pages 3-4. Exact agreement verifies a
  bounded cell proposal; disagreement abstains. It does not verify Vietnamese
  labels, row semantics for blank cells, schema IDs, accounting equations,
  Excel output, human-gold accuracy or untouched-holdout performance.
