claim_boundary: >-
  E-0036 is a bounded calibration decision on the same 64 MBB CDKT label crops.
  It can compare label proposals and downstream mapping on six pre-existing
  reviewed rows only after baseline outputs are sealed. It cannot establish
  full-document, bank-disjoint, period-disjoint, holdout or production accuracy;
  no reader may alter E-0033 geometry or E-0034 numbers.
