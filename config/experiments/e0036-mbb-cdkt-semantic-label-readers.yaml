decision_metrics_in_order:
  - reviewed_report_norm_id_exact_count
  - reviewed_source_exact_label_count
  - reviewed_label_character_error_rate
  - all_row_pairwise_exact_agreement
  - mapping_abstention_and_review_count
  - wall_seconds_and_peak_gpu_memory

authority:
  ppocrv6_and_e0033_geometry_authority: true
  e0034_numeric_value_and_status_authority: true
  semantic_readers_propose_label_text_only: true
  semantic_reader_score_establishes_truth: false
  reader_agreement_establishes_truth: false
  semantic_reader_may_change_numeric_value_sign_blank_or_dash: false
  semantic_reader_may_assign_report_norm_id: false
  reviewed_rows_may_be_loaded_before_baseline_seals: false
  automatic_model_promotion: false

forbidden_inputs_during_baseline_inference:
  - ppocr_primary_text
  - human_review_labels_ids_values_or_period_answers
  - template_labels_aliases_hierarchy_or_report_norm_ids
  - numeric_cell_text_value_sign_blank_dash_or_status
  - historical_or_mongodb_data
  - period_unit_scope_or_statement_answer
  - E_0022_source_artifacts_output_or_diagnosis
  - off_balance_page_5

claim_boundary: >-
  E-0036 is a bounded calibration decision on the same 64 MBB CDKT label crops.
  It can compare label proposals and downstream mapping on six pre-existing
  reviewed rows only after baseline outputs are sealed. It cannot establish
  full-document, bank-disjoint, period-disjoint, holdout or production accuracy;
  no reader may alter E-0033 geometry or E-0034 numbers.
