phase_claim_boundaries:
  source_structure: >-
    Seal A records deterministic source-only font-weight and slant evidence
    derived from registered crop pixels; casing and lexical row-role evidence
    derived from frozen E-0035 PP-OCR raw-label provenance; row-role proposals;
    and physical parent/section edges for the 64 E-0035 rows. Its exact canonical
    payload SHA-256 and size must be bound before schema access because payload-only
    validation cannot independently prove pixel or manifest derivation. It does not
    establish schema identity, mapping, period, unit, scope, numeric truth,
    accounting validity, Excel correctness, holdout accuracy, or production
    readiness; unsupported structure remains UNKNOWN.
  mapping_only: >-
    E-0037 mapping-only is bounded MBB CDKT calibration evidence assembled without
    opening E-0030 authoritative period/unit evidence, E-0034 numeric/status
    evidence, review, or history artifacts; no period, unit, or numeric field or
    feature is passed to the mapper. It records source structure, sealed label
    proposals, workbook-order schema candidates, accepted mappings, ambiguities,
    and unmatched evidence. It does not establish period, unit, report scope,
    numeric truth, accounting validity, Excel correctness, holdout accuracy, or
    production readiness.
  mapping_seal: >-
    This artifact seals the E-0037 mapping-only bytes before any E-0030 period/unit
    or E-0034 numeric/status evidence is opened. It does not add, rerun, repair, or
    reinterpret a mapping and makes no numeric, accounting, Excel, holdout, or
    production claim.
  postjoin: >-
    E-0037 postjoin may bind exact period axes and unit semantics from E-0030 only
    after the mapping-only seal. The final assembly must preserve accepted,
    ambiguous, unmatched, dash, blank, and challenger evidence and makes no
    bank-disjoint, period-disjoint, holdout, accounting, Excel-accuracy, or
    production-readiness claim.
