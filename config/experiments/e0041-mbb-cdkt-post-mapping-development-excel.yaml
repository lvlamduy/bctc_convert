claim_boundary: >-
  E-0041 is a calibration-only post-mapping mechanism. It joins a separately
  frozen mapping challenger to the E-0037 period/unit/numeric postjoin only by
  exact row_id after mapping has finished, retains all 128 physical cells, and
  clones the supplied CDKT workbook without changing its A:C identity range.
  Unapproved alias-dependent and unselected rows remain non-exportable. Its
  arithmetic findings are diagnostics and cannot repair mapping, status, or
  values. Formal capture is blocked until an authenticated E-0040 artifact and
  seal are bound; E-0038 is retained only as a regression baseline. It is not
  human gold, holdout evidence, production approval, or a claim that the current
  unresolved rows are absent from the source.
