development_note: >-
  The 0.99 agreement, one-cell abstention and geometry-only 0.27-line-height
  bottom-canvas policy were selected after dirty calibration smoke tests on
  this block. Padding depends only on the presence of immutable PP-OCRv6 source
  value-line indices; no label, OCR text, expected value, sign, schema ID,
  history or human review enters the crop decision. These are calibration
  controls, not untouched-holdout thresholds or a production-accuracy claim.

claim_boundary: >-
  E-0034 measures independent numeric/sign/dash agreement on the corrected
  E-0033 MBB CDKT grid. Exact agreement verifies a bounded cell proposal;
  disagreement abstains. It does not verify Vietnamese labels, blank-row
  semantics, schema IDs, accounting equations, Excel output, human-gold
  accuracy or untouched-holdout performance.
