version: 1
experiment_id: E-0024
dataset_role: LOGIC_DEVELOPMENT_AND_CALIBRATION
selection_policy: FROZEN_BEFORE_CHALLENGER_INFERENCE_SOURCE_VISIBLE_SINGLE_LINES

forbidden_holdout_sha256:
  - a85402445a34e80dd4248471c2d23d4cf4b349ab2455b91db457f3e6effbdd4a
  - d8be301b9169577a0be2bbd8721cdaaab7cb37a32493ead0de5871bfcbc168dd

authority:
  source_render_is_ground_truth: true
  expected_text_is_evaluation_only: true
  expected_text_must_not_enter_decoder: true
  semantic_reader_may_read_headings_and_labels_only: true
  semantic_reader_may_create_numeric_geometry: false
  semantic_reader_may_replace_digits_periods_units_or_signs: false
  ppocrv6_remains_geometry_and_numeric_authority: true
  automatic_ocr_post_correction: false

crop_policy:
  source_padding_left_top_right_bottom: [4, 1, 4, 1]
  white_border_left_top_right_bottom: [8, 4, 8, 4]
  color_mode: RGB
  image_format: PNG
  reject_numeric_only_samples: true

evaluation_policy:
  unicode_normalization: NFC
  whitespace_normalization: STRIP_AND_COLLAPSE_RUNS
  title_categories: [TITLE, OFF_BALANCE_TITLE]
  suffix_truncation_minimum_missing_characters: 2
  suffix_truncation_minimum_missing_fraction: 0.10
  metrics:
    - exact_line_accuracy
    - casefold_exact_line_accuracy
    - character_error_rate
    - word_error_rate
    - base_character_error_count
    - diacritic_only_error_count
    - deletion_count
    - insertion_count
    - substitution_count
  adoption_gate: >-
    Challenger aggregate CER must be strictly lower than PP-OCRv6, title exact-line
    count must not regress, empty or truncated-line count must not increase, and no
    numeric/period/unit/sign authority is granted. Otherwise retain it only as an
    abstaining proposal reader or reject it.

