version: 2
selection: ALL_TEMPLATE_ITEMS
order_authority: WORKBOOK_DISPLAY_ORDER
consumers:
  ROLE_A: ALL_TEMPLATE_ITEMS
  ROLE_B: ALL_TEMPLATE_ITEMS
  EXCEL_OUTPUT: ALL_TEMPLATE_ITEMS
  EVALUATION: ALL_TEMPLATE_ITEMS
  MANDATORY_SEARCH: ALL_TEMPLATE_ITEMS
mandatory_search:
  roles:
    - ROLE_A
    - ROLE_B
  completion_rule: EXACTLY_ONE_TERMINAL_OUTCOME_PER_SCHEMA_ID_PER_DOCUMENT
  terminal_outcomes:
    - OBSERVED_VALUE
    - OBSERVED_ZERO
    - DASH
    - BLANK
    - NOT_OBSERVED
    - NOT_APPLICABLE
    - AMBIGUOUS
    - UNRESOLVED
    # Legacy producer vocabulary remains accepted during migration. The
    # evaluation registry reports it separately rather than collapsing it.
    - OUT_OF_SCOPE_FOR_TARGET_TEMPLATE
    - AMBIGUOUS_MAPPING
    - REFERENCE_NOT_YET_BUILT
