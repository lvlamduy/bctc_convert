[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bctc-ai"
version = "0.1.0"
description = "Traceable Vietnamese bank financial-report PDF to Excel pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pymongo>=4.10,<5",
  "pymupdf>=1.25,<2",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
# GPU/document-model dependencies are deliberately isolated. They are frozen
# only after a hardware-compatible benchmark image has been selected.
models = []

[project.scripts]
bctc-ai = "bctc_ai.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bctc_ai"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
